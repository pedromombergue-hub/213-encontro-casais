<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestão de acessos | Núcleo São João</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f0e5;color:#12365d;font:16px/1.5 Arial,sans-serif}
    main{max-width:1100px;margin:28px auto;padding:0 16px 24px}
    #grant,#login{max-width:560px}
    section{background:#fff;border:1px solid #e9dfce;border-radius:14px;padding:20px;margin:16px 0}
    h1,h2{line-height:1.2}h1{margin:.4em 0}h2{font-size:1.18rem;margin:0 0 14px}
    label{display:block;font-weight:700;margin-top:12px}
    input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid #8b9aa7;border-radius:8px;color:inherit;background:#fff}
    button{font:700 15px Arial,sans-serif;min-height:44px;padding:10px 15px;border:1px solid #12365d;border-radius:8px;background:#12365d;color:#fff;cursor:pointer;margin-top:14px}
    button.secondary{background:#fff;color:#12365d}
    button:disabled{opacity:.55;cursor:wait}
    a{color:#12365d}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #916925;outline-offset:2px}
    .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 16px}
    .toolbar button{margin:0}
    .profiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
    .profile{min-width:0;padding:0 12px 12px;border:1px solid var(--profile-border);border-radius:12px;background:var(--profile-bg)}
    .profile[data-role="administracao"]{--profile-bg:#f0f4ff;--profile-border:#c6d4f3;--profile-ink:#203e85}
    .profile[data-role="secretaria"]{--profile-bg:#eaf7f8;--profile-border:#b6dfe2;--profile-ink:#096068}
    .profile[data-role="terco"]{--profile-bg:#fff5e6;--profile-border:#eed6af;--profile-ink:#79501e}
    .profile h3{display:flex;align-items:center;gap:8px;margin:0;padding:13px 0;font-size:1rem;color:var(--profile-ink)}
    .profile-icon{font-size:1.1rem;line-height:1}
    .profile-list{list-style:none;margin:0;padding:0}
    .entry{display:grid;gap:5px;padding:10px 11px;background:#fff;border:1px solid var(--profile-border);border-radius:8px}
    .entry+.entry{margin-top:8px}
    .entry strong{color:var(--profile-ink);overflow-wrap:anywhere}
    .entry button{justify-self:start;margin:0;font-size:.85rem;min-height:44px}
    .hint{font-size:.9rem;color:#415771}
    .profile .hint{margin:0}
    @media(max-width:760px){.profiles{grid-template-columns:minmax(0,1fr)}}
    #status{min-height:1.5em}#status[data-error="true"]{color:#912b24}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <header>
    <h1>Gestão de acessos</h1>
    <div class="toolbar">
      <a id="admin-back" href="admin.html" hidden>Voltar à Administração</a>
      <button type="button" id="logout" class="secondary" hidden>Sair</button>
    </div>
  </header>
  <p id="status" role="status">Verificando sessão…</p>
  <section id="login" hidden>
    <h2>Entrar como administrador</h2>
    <form id="login-form">
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="username" required>
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button>Entrar</button>
    </form>
  </section>
  <section id="grant" hidden>
    <h2>Convidar novo usuário</h2>
    <form id="grant-form">
      <label for="account">E-mail da conta</label>
      <input type="email" id="account" required>
      <label for="role">Perfil</label>
      <select id="role" aria-describedby="role-description">
        <option value="secretaria">Secretaria</option>
        <option value="terco">Equipe do Terço</option>
        <option value="administracao">Administrador</option>
      </select>
      <p class="hint" id="role-description"></p>
      <button type="submit">Convidar novo usuário</button>
    </form>
    <p class="hint">Se o e-mail já tiver conta, o perfil selecionado será adicionado à conta existente.</p>
  </section>
  <section id="access" hidden aria-labelledby="access-title">
    <h2 id="access-title">Acessos concedidos</h2>
    <div id="accounts" class="profiles"></div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.3/dist/umd/supabase.min.js"></script>
<script>
const urlSupabase='https://tmbfnzgqzraceecwcjmc.supabase.co';
const client=window.supabase.createClient(urlSupabase,'sb_publishable_KukvWR5_dlzRfFW7ZD033Q__1pUiq0M');
const el=id=>document.getElementById(id);
const perfis={
  administracao:['Administrador','Acesso completo, incluindo a gestão de permissões.','🛡️'],
  secretaria:['Secretaria','Inscrições do 213º Encontro, reuniões e recessos.','📋'],
  terco:['Terço','Agenda do Santo Terço.','🙏']
};
let usuario=null;
let processando=false;
let versao=0;

function mensagem(texto,erro=false){
  el('status').textContent=texto;
  el('status').dataset.error=String(erro);
}

function mostrarContas(contas){
  const painel=el('accounts');
  painel.replaceChildren();
  for(const [perfil,[nome,,icone]] of Object.entries(perfis)){
    const coluna=document.createElement('div');
    coluna.className='profile';
    coluna.dataset.role=perfil;
    const titulo=document.createElement('h3');
    const simbolo=document.createElement('span');
    simbolo.className='profile-icon';
    simbolo.setAttribute('aria-hidden','true');
    simbolo.textContent=icone;
    titulo.append(simbolo,nome);
    coluna.append(titulo);

    const membros=contas.filter(conta=>conta[perfil]);
    if(!membros.length){
      const vazio=document.createElement('p');
      vazio.className='hint';
      vazio.textContent='Nenhum acesso concedido.';
      coluna.append(vazio);
    }else{
      const lista=document.createElement('ul');
      lista.className='profile-list';
      for(const conta of membros){
        const linha=document.createElement('li');
        linha.className='entry';
        const email=document.createElement('strong');
        email.textContent=conta.email||'Conta sem e-mail';
        linha.append(email);
        if(perfil==='administracao'&&conta.user_id===usuario.id){
          const etiqueta=document.createElement('span');
          etiqueta.className='hint';
          etiqueta.textContent='Sua conta';
          linha.append(etiqueta);
        }else if(conta.email){
          const botao=document.createElement('button');
          botao.type='button';
          botao.className='secondary';
          botao.textContent='Retirar acesso';
          botao.setAttribute('aria-label','Retirar o perfil '+nome+' de '+conta.email);
          botao.onclick=()=>retirar(conta.email,perfil,botao);
          linha.append(botao);
        }
        lista.append(linha);
      }
      coluna.append(lista);
    }
    painel.append(coluna);
  }
}

async function atualizar(){
  const chamada=++versao;
  const {data:{session},error:sessaoErro}=await client.auth.getSession();
  if(chamada!==versao)return;
  usuario=session?.user||null;
  el('logout').hidden=!usuario;
  el('login').hidden=!!usuario;
  el('admin-back').hidden=true;
  el('grant').hidden=true;
  el('access').hidden=true;
  el('accounts').replaceChildren();
  if(!usuario){
    mensagem(sessaoErro?'Não foi possível verificar a sessão. Entre novamente.':'',!!sessaoErro);
    return false;
  }
  const {data,error}=await client.rpc('listar_permissoes_213');
  if(chamada!==versao)return;
  if(error){
    mensagem(error.code==='42501'?'Somente administradores podem gerir acessos.':'Não foi possível carregar os acessos. Atualize a página para tentar novamente.',true);
    return false;
  }
  el('admin-back').hidden=false;
  el('grant').hidden=false;
  el('access').hidden=false;
  mostrarContas(data);
  mensagem('');
  return true;
}

async function retirar(email,perfil,botao){
  if(processando)return;
  const nome=perfis[perfil][0];
  if(!confirm('Retirar o perfil '+nome+' de '+email+'?'))return;
  processando=true;
  botao.disabled=true;
  try{
    const {data,error}=await client.rpc('alterar_permissao_213',{p_email:email,p_perfil:perfil,p_habilitar:false});
    if(error){mensagem(error.message,true);return;}
    if(await atualizar()){
      mensagem(data?'Acesso retirado.':'A conta já estava sem esse perfil.');
    }
  }catch{
    mensagem('Não foi possível completar a operação. Atualize a página para conferir o estado do acesso.',true);
  }finally{
    processando=false;
    botao.disabled=false;
  }
}

el('login-form').onsubmit=async event=>{
  event.preventDefault();
  const botao=event.submitter;
  botao.disabled=true;
  try{
    const {error}=await client.auth.signInWithPassword({email:el('email').value.trim(),password:el('password').value});
    el('password').value='';
    if(error){mensagem(error.message,true);return;}
    await atualizar();
  }finally{botao.disabled=false;}
};
el('logout').onclick=async()=>{
  const {error}=await client.auth.signOut({scope:'local'});
  if(error){mensagem(error.message,true);return;}
  await atualizar();
};
async function convidar(email,perfil,botao){
  if(processando)return;
  const nome=perfis[perfil][0];
  if(!confirm('Autorizar '+email+' com o perfil '+nome+'? Se for uma conta nova, será enviado um convite.'))return;
  processando=true;
  botao.disabled=true;
  mensagem('Enviando convite…');
  try{
    const {data:{session}}=await client.auth.getSession();
    if(!session){mensagem('Sessão encerrada. Entre novamente.',true);return;}
    const resposta=await fetch(urlSupabase+'/functions/v1/convidar-usuario-213',{
      method:'POST',
      headers:{Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},
      body:JSON.stringify({email,perfil})
    });
    const resultado=await resposta.json();
    // A função de convites responde 409 para conta existente e 207 se enviou
    // o convite, mas ainda precisa concluir a concessão do perfil.
    const contaExistente=resposta.status===409;
    const conviteEnviado=resultado.enviado===true;
    let perfilAdicionado=resultado.acesso_concedido===true;
    if(contaExistente||(resposta.status===207&&conviteEnviado)){
      const {data,error}=await client.rpc('alterar_permissao_213',{
        p_email:email,p_perfil:perfil,p_habilitar:true
      });
      if(error){
        mensagem((conviteEnviado?'Convite enviado, mas o perfil ficou pendente. ':'')+error.message,true);
        return;
      }
      perfilAdicionado=data===true;
    }else if(!resposta.ok||!perfilAdicionado){
      mensagem(resultado.erro||'O envio do convite e a concessão do perfil não foram confirmados.',true);
      return;
    }
    if(await atualizar()){
      el('account').value='';
      mensagem(conviteEnviado?'Convite enviado e perfil concedido.':
        perfilAdicionado?'Perfil adicionado à conta existente.':'A conta já tinha o perfil selecionado.');
    }
  }catch{
    mensagem('Não foi possível confirmar o envio. Confira a lista de acessos antes de tentar novamente.',true);
  }finally{
    processando=false;
    botao.disabled=false;
  }
}

el('grant-form').onsubmit=event=>{
  event.preventDefault();
  const email=el('account').value.trim().toLowerCase();
  convidar(email,el('role').value,event.submitter||event.currentTarget.querySelector('button[type="submit"]'));
};
el('role').onchange=()=>el('role-description').textContent=perfis[el('role').value][1];
el('role').onchange();
atualizar();
</script>
</body>
</html>
