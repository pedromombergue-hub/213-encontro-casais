<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste interno | Secretaria 213º</title><style>body{font:16px system-ui;background:#edf4fb;color:#163a60;margin:0;padding:32px 16px}main{max-width:520px;margin:auto;background:white;padding:28px;border-radius:16px;box-shadow:0 8px 32px #173e6120}h1{font-size:24px}label{display:block;margin:16px 0 6px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:9px;font:inherit}input{border:1px solid #b6c8d9}button{margin-top:16px;background:#165a98;color:white;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}small{color:#556}#status{white-space:pre-wrap;margin-top:18px} .warn{background:#fff5dd;padding:12px;border-radius:9px}</style></head><body><main><h1>213º Encontro de Casais</h1><h2>Teste interno da Secretaria</h2><p class="warn">Apenas usuários autorizados. Esta página cria uma ficha fictícia identificada como teste. As inscrições públicas permanecem fechadas.</p><form id="login"><label>E-mail da Secretaria ou administrador</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button id="enter" type="submit">Entrar para testar</button></form><section id="authed" hidden><p>Autenticação concluída.</p><button id="create" type="button">Criar UMA inscrição fictícia</button><button id="exit" type="button" style="background:#687c90">Sair</button></section><p id="status" role="status"></p><small>Não use dados pessoais reais. Depois do teste, a ficha deverá ser excluída.</small></main><script type="module">import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const s=createClient('https://tmbfnzgqzraceecwcjmc.supabase.co','sb_publishable_KukvWR5_dlzRfFW7ZD033Q__1pUiq0M');const $=x=>document.getElementById(x),say=t=>$('status').textContent=t;let session=null;async function show(){const {data}=await s.auth.getSession();session=data.session;$('login').hidden=!!session;$('authed').hidden=!session;}await show();$('login').onsubmit=async e=>{e.preventDefault();$('enter').disabled=true;say('Autenticando...');try{const {error}=await s.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await show();say('Autenticado. Você pode criar uma inscrição fictícia.')}catch(err){say('Falha no acesso: '+err.message)}finally{$('enter').disabled=false}};$('create').onclick=async()=>{$('create').disabled=true;say('Enviando teste restrito...');try{const {data,error}=await s.functions.invoke('teste-inscricao-213',{body:{acao:'criar_teste'}});if(error){let details='';try{details=JSON.stringify(await error.context.json())}catch{}throw new Error(details||error.message)}if(!data?.ok)throw new Error(data?.erro||'Resposta inesperada');say('Teste gravado. Protocolo: '+data.protocolo+'\nAbra o painel da Secretaria para conferir.')}catch(err){say('Não foi possível criar o teste: '+err.message);$('create').disabled=false}};$('exit').onclick=async()=>{await s.auth.signOut();await show();say('Sessão encerrada.');$('create').disabled=false};</script></body></html>
